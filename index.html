<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F2">
<meta name="description" content="慢慢记 · 一个只存在你自己电脑上的记账工具。记录只是手段，算出你今天要怎么做才是目的。">
<title>慢慢记 · 只算你自己的账</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233FA48A'/%3E%3Cpath d='M9 20.5c2.2-6 4.4-8.5 6.7-8.5 1.7 0 1.3 4.6 3.2 4.6 1.2 0 2.3-1.6 3.4-4.2' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='10.5' cy='11.5' r='1.8' fill='%23F5D9A8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">慢慢记</span>
      <span class="brand-sub" data-bind="brandSub">只算你自己的账</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" data-act="toggleBookPicker" id="bookBtn" title="切换账本">
        <span class="dot"></span><span data-bind="activeBookName">日常</span>
      </button>
      <button class="icon-btn" data-act="toggleTheme" id="themeBtn" title="切换深浅色" aria-label="切换深浅色">◐</button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="主导航"></nav>
    <main class="stage" id="stage">
      <section id="view" class="view-root" tabindex="-1"></section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="主导航"></nav>
</div>

<div class="toast-layer" id="toastLayer" aria-live="polite"></div>
<div class="modal-layer" id="modalLayer"></div>

<noscript>
  <div class="noscript">这个工具需要 JavaScript 才能运行。数据只保存在你的浏览器里，不会发送到任何地方。</div>
</noscript>

<!-- 全部为本地脚本，无 CDN。默认状态下不发任何网络请求；
     只有你自己在「数据」页开启手机推送并填好 topic，才会走出那一条。 -->
<script>
/* 本地版没有服务端，也就没有 .env：这一段就是环境变量的等价位置
   （每一项的说明见同目录的 config.example.js）。
   APP_TIMEZONE 留空则跟着设备时区走；要固定就填 "Asia/Shanghai" 这类 IANA 名。
   推送的几个键全部留空 = 这条通道不存在，一次出网都不会有。
   真要用：先自建 ntfy 或改用你自己的 NTFY_BASE_URL，别把别人的 topic 当密钥用。 */
window.APP_CONFIG = {
  APP_TIMEZONE: "",
  PUSH_CHANNEL: "",                 /* "ntfy" | "pushover" | 留空 */
  NTFY_BASE_URL: "",                /* 留空 = https://ntfy.sh */
  NTFY_TOPIC: "",
  PUSHOVER_TOKEN: "",
  PUSHOVER_USER_KEY: "",
  ENABLE_DAILY_BUDGET_PUSH: "",     /* 填 "false" 是部署级硬关，页面上的开关也拧不开它 */
  BUDGET_PUSH_ON_WRITE: "",         /* 填 "false"：记完账不立刻算，只在打开页面和到点时算 */
  BUDGET_ALERT_THRESHOLDS: "80,100"
};
window.APP_TIMEZONE = window.APP_CONFIG.APP_TIMEZONE || "";
</script>
<script src="js/util.js"></script>
<script src="js/parse.js"></script>
<script src="js/store.js"></script>
<script src="js/engine.js"></script>
<script src="js/notify.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/view-today.js"></script>
<script src="js/view-plan.js"></script>
<script src="js/view-trend.js"></script>
<script src="js/view-books.js"></script>
<script src="js/view-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
